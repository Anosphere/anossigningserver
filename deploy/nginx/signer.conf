# The TLS port of signer1 and signer2: 3300, handed to the signing server
# on 127.0.0.1:8300. Installed as /etc/nginx/sites-available/signer and
# linked into sites-enabled by scripts/install-system-files.sh, once the
# certificate exists at /etc/signingserver/tls (acme.sh puts it there;
# README, "On signer1 and signer2"). The certificate is for the machine's
# own address, so there is no server_name and the file is the same on both
# machines.
#
# The port 8300 is also in /etc/signingserver/env, which
# scripts/bootstrap-vm.sh writes: nginx reads no env file. Change it in
# both places. The body cap is the server's own JSON limit, 1 MB. The
# server gets 30 seconds for its answer: it gives Google 10 seconds for a
# signature, and the wallet moves to the other signing server after 15.
# Debian's logrotate rotates the access log daily and keeps 14.
server {
    listen 3300 ssl default_server;
    server_tokens off;
    ssl_certificate /etc/signingserver/tls/fullchain.pem;
    ssl_certificate_key /etc/signingserver/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    access_log /var/log/nginx/signer-access.log;
    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 30s;
    }
}
