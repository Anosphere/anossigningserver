# Port 80 of signer1 and signer2: only the ACME HTTP-01 challenge, which
# acme.sh writes under /var/www/acme when it issues or renews the
# certificate (README, "On signer1 and signer2"); everything else on this
# port is 404. Installed as /etc/nginx/sites-available/signer-acme and
# linked into sites-enabled by scripts/install-system-files.sh. The same
# on both machines.
server {
    listen 80 default_server;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 404;
    }
}
